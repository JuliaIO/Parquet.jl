[package]
name = "parquet-jl-n5-arrow-rs-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "MIT"
description = "Offline Arrow Rust conformance oracle for Parquet.jl N5"

[dependencies]
arrow-array = { git = "https://github.com/apache/arrow-rs.git", rev = "782e5a685501a9db6cc8e9a3b7cbff894940c47a" }
arrow-cast = { git = "https://github.com/apache/arrow-rs.git", rev = "782e5a685501a9db6cc8e9a3b7cbff894940c47a" }
arrow-json = { git = "https://github.com/apache/arrow-rs.git", rev = "782e5a685501a9db6cc8e9a3b7cbff894940c47a" }
arrow-schema = { git = "https://github.com/apache/arrow-rs.git", rev = "782e5a685501a9db6cc8e9a3b7cbff894940c47a" }
parquet = { git = "https://github.com/apache/arrow-rs.git", rev = "782e5a685501a9db6cc8e9a3b7cbff894940c47a", default-features = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
