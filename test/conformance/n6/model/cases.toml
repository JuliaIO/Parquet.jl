schema_version = 1
authority_plan_sha256 = "15adf34af765a3300d8a49ced73532ed02b7e4edee5764453c58e53fcf12c304"
parquet_format_commit = "c47e2a66e88943fc46fde1b028a9432f14fdf5c0"
arrow_statistics_policy_commit = "515410b2a14ac766258e00b07eab9e5ee2692a62"
parquet_java_tag = "apache-parquet-1.17.1"
parquet_java_commit = "78a8d3230eb4769db93de5f2f2e18363c04cae81"
parquet_java_embedded_format = "2.12"
module = "N6StatisticsModel.jl"
runner = "runtests.jl"
production_dependency_allowed = false

[float16]
pattern_count = 65536
nan_pattern_count = 2046
ordered_little_endian_sha256 = "61619b1a4260ee4cff6d462d21cab5a049198a27b3a9ae3e8ecfe246efc1d4b6"
first_pattern = "ffff"
last_pattern = "7fff"

[limits]
default_statistics_value_bytes = 4096
equality_succeeds = true
fixed_structure_precedes_limit = true
variable_limit_precedes_semantics = true

[[case_groups]]
id = "plain-bound-decoding"
requirements = ["exact fixed widths", "little-endian scalars", "raw variable bytes"]
capabilities = ["semantic.type-order"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.type-order" = "15a1da9c96f3c7cf71dc3a61022aa49bc9b6c235f22288fd0340c460f728eee1" }

[[case_groups]]
id = "logical-bound-validity"
requirements = ["UTF-8", "JSON", "BSON structure", "BSON binary subtype", "BSON regex options", "UUID", "INTEGER", "TIME", "FLOAT16"]
capabilities = ["semantic.logical-order"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.logical-order" = "59acacd3241521be47618a40f279fb36bd4141e2c971f510551b6e7d8b34ed53" }

[[case_groups]]
id = "decimal-order"
requirements = ["two's-complement normalization", "precision", "no BigInt"]
capabilities = ["semantic.logical-order"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.logical-order" = "b9fc8ce26cbbb5f44922aa90053520249f7d2e35a566740ebfd7d3436dfdaf1a" }

[[case_groups]]
id = "count-state-machine"
requirements = ["null", "NaN", "distinct", "checked relationships", "zero values without counts", "empty bounds", "all-NaN"]
capabilities = ["semantic.count-state", "wire.statistics.nan-count"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.count-state" = "d8a7163f59defdcb8c771e07c0ddec65e873967340355e2eda07f63129eeff01", "wire.statistics.nan-count" = "123d4393ed7f2b9df6b22642f7e293a1db6e4c7ffac4b5ab30b3e7b34ec8acbe" }

[[case_groups]]
id = "atomic-bound-family"
requirements = ["modern precedence", "no deprecated fill", "one-sided bounds"]
capabilities = ["semantic.count-state", "semantic.type-order"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.count-state" = "ce7d5eba1d6c8167af6d8c78b753c76dda1adcbdce93427569bca80334ea054d", "semantic.type-order" = "03356ecaa321e342f7362031499f4a110c6d426619b3abcea19bd869f6f38fb4" }

[[case_groups]]
id = "type-order-float"
requirements = ["independent NaN rejection", "signed-zero widening", "exactness downgrade"]
capabilities = ["semantic.type-order"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.type-order" = "fb4ad657bd0f65b0e9b6b0c470e4290994724f60ef06774146c3d0b7777b7023" }

[[case_groups]]
id = "ieee-total-order"
requirements = ["raw-bit key", "NaN payloads", "signed zeros", "count-bound states"]
capabilities = ["semantic.ieee-total-order", "wire.statistics.nan-count"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.ieee-total-order" = "d596fee1637b66a94cef82ad91332ef69393fa486400ea8ee7cdbcde2ac97ccd", "wire.statistics.nan-count" = "2b167a8c7168592a836b8abc6856d15440bf2c69a365c05dd3f896eb4750628a" }

[[case_groups]]
id = "float16-exhaustive"
requirements = ["all 65536 patterns", "all 2046 NaNs", "frozen order digest"]
capabilities = ["semantic.ieee-total-order"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.ieee-total-order" = "e4d2981184aa5082519114ba3dc7e5f000fdf0e70067fe33750dbe6ac7c6717b" }

[[case_groups]]
id = "producer-parquet-251"
requirements = ["parquet-java parser", "bare token rejection", "both families", "CDH exception", "RC", "final", "partial version", "equality does not override"]
capabilities = ["compat.legacy-statistics", "semantic.producer-trust"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "compat.legacy-statistics" = "cdaa409cc6dada3fada0752543aa6911174cd2523a38f996490e814bc1f58b1a", "semantic.producer-trust" = "fb6f35682ebf84d6b3bb9a505cc91dd6154c8f5c05fab20798081afb11d1f496" }

[[case_groups]]
id = "producer-old-order"
requirements = ["Arrow parser", "bare parquet producer", "parquet-cpp 1.3", "parquet-mr 1.10", "RC", "final", "partial versions conservative", "IEEE non-signed", "equal bytes"]
capabilities = ["semantic.producer-trust"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.producer-trust" = "689dc5b2feee3b711beb804acd48d1c1b47f6d5654e94bccba1d7429154dd91d" }

[[case_groups]]
id = "limit-precedence"
requirements = ["negative entry failure", "zero", "exact", "one over", "writer omit both"]
capabilities = []
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = {}

[[case_groups]]
id = "independent-extrema"
requirements = ["mixed NaN", "all NaN", "TYPE_ORDER", "IEEE order", "containment", "input snapshot"]
capabilities = ["semantic.ieee-total-order"]
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = { "semantic.ieee-total-order" = "f7e06eaadeda5d00e52ed4f7196cb3e39ce867fd256814bf8876ad165cfb1288" }

[[case_groups]]
id = "forbidden-dependencies"
requirements = ["no package import", "no production source include", "no production namespace call"]
capabilities = []
digest_contract = "n6-capability-result-sha256-v1"
expected_sha256 = {}
